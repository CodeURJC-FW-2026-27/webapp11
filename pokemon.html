<body class="d-flex flex-column min-vh-100">

                    <!-- Logo Section -->
                    <div class="col-lg-4 col-6">

                                <img src="images/pokeball-icon-594337-512.png" alt="Notika" class="d-none d-md-block" style="height: 40px;">

                </div>

    <!-- End Modern Header -->

    <div class="container">

        </div>

    </div>

            <button type="button" class="btn btn-primary"> <i class="bi bi-pencil-square"></i>  Editar </button>
            <a href="pokemon.html" class="btn btn-primary" role="button"> <i class="bi bi-box-arrow-left"></i> Volver </a>
