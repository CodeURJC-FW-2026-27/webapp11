<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Create Pokemon</title>

    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Project CSS -->
    <link rel="stylesheet" href="css/mobile-menu.css">
    <link rel="stylesheet" href="css/header-modern-clean.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/modern.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="custom.css">
</head>

<body>

    <!-- Modern Bootstrap 5 Header -->
    <header class="notika-header">
        <div class="container">
            <div class="row align-items-center">
                <!-- Logo Section -->
                <div class="col-lg-4 col-6">
                    <div class="notika-brand d-flex align-items-center gap-3">
                        <a href="index.html">
                            <!-- Desktop Logo (768px and up) -->
                            <img src="images/pokeball-icon-594337-512.png" alt="Notika" class="d-none d-md-block"
                                style="height: 40px;">
                        </a>
                        <h2 class="header-title mb-0">Crear Pokémon</h2>
                    </div>
                </div>
                <!-- Navigation Section -->
                <div class="col-lg-8 col-6">
                    <div class="notika-nav justify-content-end d-flex align-items-center gap-2 gap-lg-3">

                        <!-- Search -->
                        <div class="dropdown">
                            <button class="notika-nav-link" type="button" data-bs-toggle="dropdown"
                                data-bs-auto-close="outside" aria-label="Search">
                                <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end notika-dropdown search-dropdown">
                                <div class="search-input-group">
                                    <input type="text" placeholder="Search anything..." class="form-control">
                                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Create -->
                        <div class="dropdown">
                            <button class="notika-nav-link" type="button" data-bs-toggle="dropdown"
                                aria-label="Messages">
                                <i aria-hidden="true" class="fa-solid fa-plus"></i>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end notika-dropdown">
                                <div class="notika-dropdown-header">
                                    Create New
                                </div>
                                <div class="notika-dropdown-body">
                                    <a class="notika-dropdown-item" href="new-pokemon.html">
                                        <div style="position: relative;">
                                            <img src="images/pokeball.svg" alt="User">
                                        </div>
                                        <div class="notika-dropdown-content">
                                            <h6>Pokemon</h6>
                                        </div>
                                    </a>
                                    <a class="notika-dropdown-item" href="new-abilities.html">
                                        <div style="position: relative;">
                                            <img src="images/abilities.svg" alt="User">
                                        </div>
                                        <div class="notika-dropdown-content">
                                            <h6>Abilities</h6>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Mobile Menu Toggle -->
                        <button class="notika-nav-link d-lg-none" type="button" data-bs-toggle="offcanvas"
                            data-bs-target="#mobileNavOffcanvas" aria-controls="mobileNavOffcanvas"
                            aria-label="Toggle navigation">
                            <i aria-hidden="true" class="fa-solid fa-bars"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- End Modern Header -->

    <!-- Start Create Pokemon area -->
    <div class="container">

        <div class="row justify-content-center">
            <div class="col-12">
                <div class="wb-traffic-inner notika-shadow">

                    <form>
                        <!-- Pokemon name -->
                        <div class="mb-3">
                            <label for="pokemon-name" class="form-label">Nombre</label>
                            <input type="text" id="pokemon-name" name="name" class="form-control" required>
                        </div>

                        <!-- Pokedex number -->
                        <div class="mb-3">
                            <label for="pokedex-number" class="form-label">Número de la Pokédex</label>
                            <input type="number" id="pokedex-number" name="pokedexNumber" class="form-control" min="1"
                                required>
                        </div>

                        <!-- Type -->
                        <div class="mb-3">
                            <label for="pokemon-type" class="form-label">Tipo</label>
                            <select id="pokemon-type" name="type" class="form-select" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="normal">Normal</option>
                                <option value="fire">Fuego</option>
                                <option value="water">Agua</option>
                                <option value="grass">Planta</option>
                                <option value="electric">Eléctrico</option>
                                <option value="ice">Hielo</option>
                                <option value="fighting">Lucha</option>
                                <option value="poison">Veneno</option>
                                <option value="ground">Tierra</option>
                                <option value="flying">Volador</option>
                                <option value="psychic">Psíquico</option>
                                <option value="bug">Bicho</option>
                                <option value="rock">Roca</option>
                                <option value="ghost">Fantasma</option>
                                <option value="dragon">Dragón</option>
                                <option value="dark">Siniestro</option>
                                <option value="steel">Acero</option>
                                <option value="fairy">Hada</option>
                            </select>
                            <!--Yes, I hate this, yes, it will be changed with javascript in the future-->
                        </div>

                        <!-- Generation -->
                        <div class="mb-3">
                            <label for="pokemon-generation" class="form-label">Generación</label>
                            <select id="pokemon-generation" name="generation" class="form-select" required>
                                <option value="">Selecciona una generación</option>
                                <option value="1">Generación I</option>
                                <option value="2">Generación II</option>
                                <option value="3">Generación III</option>
                                <option value="4">Generación IV</option>
                                <option value="5">Generación V</option>
                                <option value="6">Generación VI</option>
                                <option value="7">Generación VII</option>
                                <option value="8">Generación VIII</option>
                                <option value="9">Generación IX</option>
                            </select>
                        </div>

                        <!-- Height -->
                        <div class="mb-3">
                            <label for="pokemon-height" class="form-label">Altura (m)</label>
                            <input type="number" id="pokemon-height" name="height" class="form-control" min="0"
                                step="0.1" required>
                        </div>

                        <!-- Weight -->
                        <div class="mb-3">
                            <label for="pokemon-weight" class="form-label">Peso (kg)</label>
                            <input type="number" id="pokemon-weight" name="weight" class="form-control" min="0"
                                step="0.1" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="pokemon-description" class="form-label">Descripción</label>
                            <textarea id="pokemon-description" name="description" class="form-control" rows="4"
                                required></textarea>
                        </div>

                        <!-- Image -->
                        <div class="mb-3">
                            <label for="pokemon-image" class="form-label">Imagen</label>
                            <input type="file" id="pokemon-image" name="image" class="form-control" accept="image/*"
                                required>
                        </div>

                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" class="btn btn-primary">
                                Guardar
                            </button>

                            <a href="home.html" class="btn btn-primary" role="button">
                                Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </div>
    <!-- End Create Pokemon area -->
</body>

</html>
