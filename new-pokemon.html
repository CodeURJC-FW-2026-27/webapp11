<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Create Pokemon</title>

        <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

        <!-- Bootstrap 5 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Font Awesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <!-- Project CSS -->
        <link rel="stylesheet" href="css/mobile-menu.css">
        <link rel="stylesheet" href="css/header-modern-clean.css">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="css/modern.css">
        <link rel="stylesheet" href="css/responsive.css">
        <link rel="stylesheet" href="custom.css">
    </head>

    <body>

<!-- Modern Bootstrap 5 Header -->
    <header class="notika-header">
        <div class="container">
            <div class="row align-items-center">
                <!-- Logo Section -->
                <div class="col-lg-4 col-6">
                    <div class="notika-brand">
                        <a href="home.html">
                            <!-- Desktop Logo (768px and up) -->
                            <img src="images/pokeball-icon-594337-512.png" alt="Notika" class="d-none d-md-block" style="height: 40px;">
                        </a>
                    </div>
                </div>

                <!-- Navigation Section -->
                <div class="col-lg-8 col-6">
                    <div class="notika-nav justify-content-end d-flex align-items-center gap-2 gap-lg-3">

                        <!-- Search -->
                        <div class="dropdown">
                            <button class="notika-nav-link" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Search">
                                <i aria-hidden="true" class="fa-solid fa-magnifying-glass"></i>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end notika-dropdown search-dropdown">
                                <div class="search-input-group">
                                    <input type="text" placeholder="Search anything..." class="form-control">
                                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                                </div>
                            </div>
                        </div>  

                        <!-- Create -->
                        <div class="dropdown">
                            <button class="notika-nav-link" type="button" data-bs-toggle="dropdown" aria-label="Messages">
                                <i aria-hidden="true"  class="fa-solid fa-plus"></i>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end notika-dropdown">
                                <div class="notika-dropdown-header">
                                    Create New
                                </div>
                                <div class="notika-dropdown-body">
                                    <a class="notika-dropdown-item" href="new-pokemon.html">
                                        <div style="position: relative;">
                                            <img src="images/pokeball.svg" alt="User">
                                        </div>
                                        <div class="notika-dropdown-content">
                                            <h6>Pokemon</h6>
                                        </div>
                                    </a>
                                    <a class="notika-dropdown-item" href="new-abilities.html">
                                        <div style="position: relative;">
                                            <img src="images/abilities.svg" alt="User">
                                        </div>
                                        <div class="notika-dropdown-content">
                                            <h6>Abilities</h6>
                                        </div>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <!-- Mobile Menu Toggle -->
                        <button class="notika-nav-link d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNavOffcanvas" aria-controls="mobileNavOffcanvas" aria-label="Toggle navigation">
                            <i aria-hidden="true" class="fa-solid fa-bars"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- End Modern Header -->

    <!-- Start Create Pokemon area -->
    <div class="container">

        <div class="text-center">
            <h2><strong>Crear Pokémon</strong></h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-12">

                <!-- Form will be added here -->

            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 p-3">
            <button type="button" class="btn btn-primary">
                Guardar
            </button>

            <a href="home.html" class="btn btn-primary" role="button">
                Cancelar
            </a>
        </div>

    </div>
    <!-- End Create Pokemon area -->

    </body>
</html>
