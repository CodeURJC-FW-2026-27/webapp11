<!-- =========================================================================
     REUSABLE FORM ERROR PARTIAL (views/form-error.html)
     Shared Mustache partial to render an error occurring during form processing.
     Can target ANY form across the application.
     
     Accepted context variables:
     - iconClass: (String) FontAwesome class (e.g. "fa-circle-exclamation text-danger")
     - formName: (String, optional) Name/path of the form (e.g. "Crear Pokémon")
     - title: (String) Main error heading
     - badgeClass: (String) Bootstrap badge class (e.g. "bg-danger text-white")
     - errorType: (String) Category or kind of error (e.g. "Conflicto 409")
     - message: (String) Main explanatory paragraph
     - hasErrorDetails: (Boolean, optional) Whether there are specific field error bullets
     - errorDetails: (Array of Strings, optional) Detailed bullet points explaining specific field errors
     - actionUrl: (String) Redirection link leading to the correct form page to retry/fix
     - actionText: (String) Label for the primary redirect button
     - backUrl: (String) Fallback redirection link
     - backText: (String) Label for secondary button
     ========================================================================= -->
<article class="error-card notika-shadow">
    <!-- Error Status Icon -->
    <header class="error-card-header">
        <div class="error-status-icon" aria-hidden="true">
            <i class="fa-solid {{iconClass}}"></i>
        </div>

        <!-- Target Form Identification Badge and Error Main Heading -->
        <div class="error-heading">
            {{#formName}}
            <!-- Target Form Identification Badge -->
            <span class="error-form-name">
                <i class="fa-solid fa-file-lines me-1" aria-hidden="true"></i>
                {{{formName}}}
            </span>
            {{/formName}}
            <!-- Error Main Heading -->
            <h2>{{title}}</h2>
        </div>

        <!-- Error Type Badge (Explains the kind of error) -->
        <span class="badge {{badgeClass}} error-type-badge">
            <i class="fa-solid fa-triangle-exclamation me-1"></i>
            {{errorType}}
        </span>
    </header>

    <!-- Detailed Explanation Box -->
    <div class="error-explanation">
        <h3><i class="fa-solid fa-circle-info me-2"></i>¿Por qué ha ocurrido este error?</h3>
        <p>{{message}}</p>
        {{#hasErrorDetails}}
        <ul class="error-details">
            {{#errorDetails}}<li>{{{.}}}</li>{{/errorDetails}}
        </ul>
        {{/hasErrorDetails}}
    </div>

    <!-- Action / Redirection Buttons -->
    <footer class="error-actions">
        <!-- Primary Button: Redirect to the correct form page -->
        <a href="{{{actionUrl}}}" class="btn error-primary-action">
            <i class="fa-solid fa-arrow-rotate-left me-2"></i>{{actionText}}
        </a>

        <!-- Secondary Button: Return to Home / Pokédex -->
        <a href="{{{backUrl}}}" class="btn error-secondary-action">
            <i class="fa-solid fa-house me-2"></i>{{backText}}
        </a>
    </footer>
</article>
