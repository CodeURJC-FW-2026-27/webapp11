{{>header}}

<!-- =========================================================================
     MAIN CONTENT AREA: CREATE POKÉMON FORM
     ========================================================================= -->
<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-12">
            <div class="wb-traffic-inner notika-shadow d-block">
                <h2 class="fw-bold mb-4 text-dark">Crear Nuevo Pokémon</h2>
                
                <form>
                    <!-- Row 1: Name & Pokedex Number -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="pokemon-name" class="form-label"><strong>Nombre:</strong></label>
                            <input type="text" id="pokemon-name" name="name" class="form-control" placeholder="Ej. Pikachu" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="pokedex-number" class="form-label"><strong>Número de la Pokédex:</strong></label>
                            <input type="number" id="pokedex-number" name="pokedexNumber" class="form-control" min="1" placeholder="Ej. 25" required>
                        </div>
                    </div>

                    <!-- Row 2: Type Select & Generation Select -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="pokemon-type" class="form-label"><strong>Tipo:</strong></label>
                            <select id="pokemon-type" name="type" class="form-select" required>
                                <option value="" selected disabled>Selecciona un tipo</option>
                                <option value="normal">Normal</option>
                                <option value="fire">Fuego</option>
                                <option value="water">Agua</option>
                                <option value="grass">Planta</option>
                                <option value="electric">Eléctrico</option>
                                <option value="ice">Hielo</option>
                                <option value="fighting">Lucha</option>
                                <option value="poison">Veneno</option>
                                <option value="ground">Tierra</option>
                                <option value="flying">Volador</option>
                                <option value="psychic">Psíquico</option>
                                <option value="bug">Bicho</option>
                                <option value="rock">Roca</option>
                                <option value="ghost">Fantasma</option>
                                <option value="dragon">Dragón</option>
                                <option value="dark">Siniestro</option>
                                <option value="steel">Acero</option>
                                <option value="fairy">Hada</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="pokemon-generation" class="form-label"><strong>Generación:</strong></label>
                            <select id="pokemon-generation" name="generation" class="form-select" required>
                                <option value="" selected disabled>Selecciona una generación</option>
                                <option value="1">Generación I</option>
                                <option value="2">Generación II</option>
                                <option value="3">Generación III</option>
                                <option value="4">Generación IV</option>
                                <option value="5">Generación V</option>
                                <option value="6">Generación VI</option>
                                <option value="7">Generación VII</option>
                                <option value="8">Generación VIII</option>
                                <option value="9">Generación IX</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 3: Height & Weight (Decimals) -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="pokemon-height" class="form-label"><strong>Altura (m):</strong></label>
                            <input type="number" id="pokemon-height" name="height" class="form-control" min="0" step="0.1" placeholder="Ej. 0.4" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="pokemon-weight" class="form-label"><strong>Peso (kg):</strong></label>
                            <input type="number" id="pokemon-weight" name="weight" class="form-control" min="0" step="0.1" placeholder="Ej. 6.0" required>
                        </div>
                    </div>

                    <!-- Row 4: Description Textarea -->
                    <div class="mb-3">
                        <label for="pokemon-description" class="form-label"><strong>Descripción:</strong></label>
                        <textarea id="pokemon-description" name="description" class="form-control" rows="4" placeholder="Escribe una descripción del Pokémon..." required></textarea>
                    </div>

                    <!-- Row 5: Image File Upload Input -->
                    <div class="mb-3">
                        <label for="pokemon-image" class="form-label"><strong>Imagen:</strong></label>
                        <input type="file" id="pokemon-image" name="image" class="form-control" accept="image/*" required>
                    </div>

                    <!-- Form Action Control Buttons (Save & Cancel) -->
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
                        </button>

                        <a href="/" class="btn btn-primary" role="button">
                            <i class="fa-solid fa-xmark me-1"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- End Create Pokemon Area -->

{{>footer}}
